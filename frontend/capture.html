<!DOCTYPE html>
<html>
<head>
<title>Capture Photo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

:root {
  --ink: #0a0a0f;
  --surface: #ffffff;
  --muted: #6b7280;
  --accent: #7c3aed;
  --accent2: #db2777;
  --line: #e5e7eb;
  --card-bg: #f7f7fa;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--surface);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}

/* ── BACKGROUND ── */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* ── CARD ── */
.capture-card {
  background: var(--surface);
  width: 1000px;
  max-width: 100%;
  border-radius: 28px;
  padding: 36px 36px 30px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  z-index: 1;
  animation: fadeUp 0.7s ease both;
}

/* ── HEADER ── */
.capture-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.capture-header-left { display: flex; flex-direction: column; gap: 4px; }

.step-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.capture-title {
  font-family: "Syne", sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink);
}

.progress-dots {
  display: flex;
  gap: 8px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.active { background: var(--ink); width: 24px; border-radius: 4px; }

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding-left: 2px;
}

.box {
  background: var(--card-bg);
  border-radius: 18px;
  overflow: hidden;
  height: 310px;
  border: 1px solid var(--line);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* camera feed tint */
.box.camera-box { background: #0a0a0f; }

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}
.empty-icon {
  width: 44px; height: 44px;
  border: 1.5px dashed #d1d5db;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.empty-text { font-size: 13px; font-weight: 400; }

/* ── ACTIONS ── */
.actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.btn {
  padding: 11px 28px;
  border-radius: 100px;
  border: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: "DM Sans", sans-serif;
  transition: all 0.22s ease;
  letter-spacing: 0.01em;
}

.btn-blue {
  background: var(--ink);
  color: #fff;
}
.btn-blue:hover { opacity: 0.82; transform: translateY(-2px); }

.btn-gray {
  background: var(--card-bg);
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-gray:hover { border-color: var(--ink); transform: translateY(-2px); }

.btn-pink {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
}
.btn-pink:hover { opacity: 0.88; transform: translateY(-2px); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  .box { height: 220px; }
  .capture-title { font-size: 20px; }
  .actions { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="capture-card">

  <div class="capture-header">
    <div class="capture-header-left">
      <div class="step-label">Step 2 of 3</div>
      <div class="capture-title">Capture or Upload Your Photo</div>
    </div>
    <div class="progress-dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="grid">

    <!-- LIVE CAMERA -->
    <div class="panel">
      <div class="label">Live Camera</div>
      <div class="box camera-box">
        <video id="video" autoplay></video>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="panel">
      <div class="label">Preview</div>
      <div class="box" id="previewBox">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          <div class="empty-text">Photo will appear here</div>
        </div>
        <img id="previewImg" style="display:none;" />
      </div>
    </div>

  </div>

  <div class="actions">
    <button class="btn btn-blue" onclick="capturePhoto()">Capture</button>
    <input type="file" id="photoInput" accept="image/*" hidden onchange="previewUpload(event)">
    <button class="btn btn-gray" onclick="document.getElementById('photoInput').click()">Upload</button>
    <button class="btn btn-pink" onclick="processImage()">Continue</button>
  </div>

</div>

<script src="js/api.js"></script>

<script>
let capturedFile = null;

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    document.getElementById("video").srcObject = stream;
  })
  .catch(err => {
    alert("Camera access denied!");
  });

function showPreview(src) {
  document.getElementById("emptyState").style.display = "none";
  const img = document.getElementById("previewImg");
  img.style.display = "block";
  img.src = src;
}

function capturePhoto() {
  const video = document.getElementById("video");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);
  const dataURL = canvas.toDataURL("image/jpeg");
  showPreview(dataURL);
  canvas.toBlob(blob => {
    capturedFile = new File([blob], "captured.jpg", { type: "image/jpeg" });
  });
}

function previewUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  capturedFile = file;
  const reader = new FileReader();
  reader.onload = function(e) { showPreview(e.target.result); };
  reader.readAsDataURL(file);
}

async function processImage() {
  let file = capturedFile;
  if (!file) {
    alert("Please capture or upload an image!");
    return;
  }
  const uploadResult = await uploadImage(file);
  const imagePath = uploadResult.image_path;
  const faceResult = await analyzeFace(imagePath);
  const faceShape = faceResult.face_shape;
  const gender = localStorage.getItem("gender");
  const avatar = await getAvatar(gender, faceShape);
  localStorage.setItem("face_shape", faceShape);
  localStorage.setItem("avatar_obj", avatar.obj);
  localStorage.setItem("avatar_mtl", avatar.mtl);
  window.location.href = "avatar.html";
}
</script>

</body>
</html>
