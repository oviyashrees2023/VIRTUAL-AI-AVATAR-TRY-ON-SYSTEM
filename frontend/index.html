<!DOCTYPE html>
<html>
<head>
  <title>Virtual Avatar System</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

:root {
  --ink: #0a0a0f;
  --surface: #ffffff;
  --muted: #6b7280;
  --accent: #7c3aed;
  --accent2: #db2777;
  --line: #e5e7eb;
  --card-bg: #f7f7fa;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--surface);
  color: var(--ink);
  overflow: hidden;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}
.bg-blob1 {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.07), transparent 70%);
  top: -200px; left: -200px;
  pointer-events: none;
  z-index: 0;
}
.bg-blob2 {
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(219,39,119,0.06), transparent 70%);
  bottom: -150px; right: -150px;
  pointer-events: none;
  z-index: 0;
}

.gender-container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  animation: fadeIn 0.7s ease both;
  position: relative;
  z-index: 1;
}

.step-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.gender-title {
  font-family: "Syne", sans-serif;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -1.5px;
  color: var(--ink);
  text-align: center;
  margin-bottom: 10px;
}

.gender-sub {
  font-size: 15px;
  color: var(--muted);
  font-weight: 300;
  margin-bottom: 20px;
  text-align: center;
}

.gender-buttons {
  display: flex;
  gap: 20px;
}

.gender-btn {
  width: 200px;
  height: 200px;
  border-radius: 24px;
  border: 1.5px solid var(--line);
  background: var(--card-bg);
  font-family: "Syne", sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}

.gender-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.3s;
}

.gender-btn.male::before {
  background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(99,102,241,0.06));
}
.gender-btn.female::before {
  background: linear-gradient(135deg, rgba(219,39,119,0.08), rgba(249,115,22,0.05));
}

.gender-btn:hover {
  border-color: var(--ink);
  transform: translateY(-6px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
}
.gender-btn:hover::before { opacity: 1; }

.gender-icon {
  display: block;
}

.gender-btn-label {
  font-family: "Syne", sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  position: relative;
}

.gender-hint {
  font-size: 12px;
  color: var(--muted);
  font-weight: 300;
  font-family: "DM Sans", sans-serif;
  position: relative;
}

.progress-dots {
  display: flex;
  gap: 8px;
  margin-top: 36px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--line);
}
.dot.active {
  background: var(--ink);
  width: 24px;
  border-radius: 4px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .gender-buttons { flex-direction: column; }
  .gender-btn { width: 170px; height: 170px; }
  .gender-title { font-size: 34px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-blob1"></div>
<div class="bg-blob2"></div>

<div class="gender-container">
  <div class="step-label">Step 1 of 3</div>
  <div class="gender-title">Choose Your Avatar</div>
  <div class="gender-sub">Select your gender to get the right 3D model</div>

  <div class="gender-buttons">
    <button class="gender-btn male" onclick="selectGender('male')">
      <svg class="gender-icon" width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="23" r="9" stroke="#0a0a0f" stroke-width="2.5"/>
        <line x1="23" y1="16" x2="33" y2="6" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="27" y1="6" x2="33" y2="6" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="33" y1="6" x2="33" y2="12" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="gender-btn-label">Male</span>
      <span class="gender-hint">Masculine avatar</span>
    </button>
    <button class="gender-btn female" onclick="selectGender('female')">
      <svg class="gender-icon" width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="15" r="9" stroke="#0a0a0f" stroke-width="2.5"/>
        <line x1="20" y1="24" x2="20" y2="35" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="14" y1="30" x2="26" y2="30" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="gender-btn-label">Female</span>
      <span class="gender-hint">Feminine avatar</span>
    </button>
  </div>

  <div class="progress-dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
function selectGender(gender) {
  localStorage.setItem("gender", gender);
  window.location.href = "capture.html";
}
</script>
</body>
</html>
